<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>제니야 작업 결과 - 오상열 대표</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: 0 auto;
}
.back-btn {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    color: white;
    padding: 10px 20px;
    border-radius: 25px;
    text-decoration: none;
    margin-bottom: 20px;
    font-size: 14px;
    transition: background 0.2s;
}
.back-btn:hover {
    background: rgba(255,255,255,0.3);
}
.card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}
.header {
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 20px;
    margin-bottom: 30px;
}
.type-badge {
    display: inline-block;
    background: #667eea;
    color: white;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    margin-bottom: 12px;
}
.title {
    font-size: 28px;
    color: #333;
    margin-bottom: 10px;
    line-height: 1.3;
}
.meta {
    color: #888;
    font-size: 14px;
}
.content {
    line-height: 1.8;
    color: #444;
    font-size: 16px;
}
.content h1 { font-size: 26px; margin: 30px 0 15px; color: #333; }
.content h2 { font-size: 22px; margin: 25px 0 12px; color: #333; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; }
.content h3 { font-size: 18px; margin: 20px 0 10px; color: #555; }
.content p { margin: 12px 0; }
.content ul, .content ol { margin: 12px 0 12px 24px; }
.content li { margin: 6px 0; }
.content code {
    background: #f5f5f7;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'Monaco', 'Consolas', monospace;
    font-size: 14px;
}
.content pre {
    background: #f5f5f7;
    padding: 15px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 15px 0;
}
.content blockquote {
    border-left: 4px solid #667eea;
    padding-left: 16px;
    margin: 15px 0;
    color: #666;
    font-style: italic;
}
.content strong { color: #333; }
.content table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
}
.content th, .content td {
    padding: 12px;
    text-align: left;
    border: 1px solid #e0e0e0;
}
.content th {
    background: #f8f9ff;
    font-weight: 600;
}
.loading, .error {
    text-align: center;
    padding: 60px 20px;
    color: #888;
}
.loading .icon, .error .icon {
    font-size: 48px;
    margin-bottom: 20px;
}
.actions {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.btn {
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 14px;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
}
.btn-primary {
    background: #667eea;
    color: white;
}
.btn-primary:hover {
    background: #5568d3;
}
.btn-secondary {
    background: #f0f0f5;
    color: #555;
}
.btn-secondary:hover {
    background: #e5e5ea;
}
</style>
</head>
<body>
<div class="container">
    <a href="/" class="back-btn">← 작업공간 홈</a>
    <div class="card">
        <div id="contentContainer">
            <div class="loading">
                <div class="icon">⏳</div>
                <p>결과물을 불러오는 중입니다...</p>
            </div>
        </div>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const resultId = urlParams.get('id');

async function loadResult() {
    const container = document.getElementById('contentContainer');
    
    if (!resultId) {
        container.innerHTML = `
            <div class="error">
                <div class="icon">⚠️</div>
                <p>결과물 ID가 없습니다.</p>
            </div>`;
        return;
    }

    try {
        const response = await fetch(`https://jenya-cloud.onrender.com/workspace-result/${resultId}`);
        
        if (!response.ok) {
            throw new Error('결과물을 찾을 수 없습니다.');
        }
        
        const data = await response.json();
        displayResult(data);
    } catch (error) {
        container.innerHTML = `
            <div class="error">
                <div class="icon">❌</div>
                <p>결과물을 불러오지 못했습니다.</p>
                <p style="font-size: 13px; margin-top: 10px;">${error.message}</p>
            </div>`;
    }
}

function displayResult(data) {
    const container = document.getElementById('contentContainer');
    const date = data.createdAt ? new Date(data.createdAt).toLocaleString('ko-KR') : '';
    
    container.innerHTML = `
        <div class="header">
            <span class="type-badge">${data.type || '문서'}</span>
            <h1 class="title">${escapeHtml(data.title || '제목 없음')}</h1>
            <div class="meta">${date}</div>
        </div>
        <div class="content" id="markdownContent"></div>
        <div class="actions">
            <button class="btn btn-primary" onclick="copyContent()">📋 본문 복사</button>
            <button class="btn btn-secondary" onclick="window.print()">🖨️ 인쇄</button>
            <button class="btn btn-secondary" onclick="window.location.href='/'">← 목록으로</button>
        </div>`;
    
    document.getElementById('markdownContent').innerHTML = renderMarkdown(data.content || '');
    window.__rawContent = data.content || '';
}

function renderMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/`(.+?)`/g, '<code>$1</code>');
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => '<ul>' + m + '</ul>');
    html = html.replace(/\n\n/g, '</p><p>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p>(<h[1-3]>)/g, '$1');
    html = html.replace(/(<\/h[1-3]>)<\/p>/g, '$1');
    html = html.replace(/<p>(<ul>)/g, '$1');
    html = html.replace(/(<\/ul>)<\/p>/g, '$1');
    return html;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function copyContent() {
    if (window.__rawContent) {
        navigator.clipboard.writeText(window.__rawContent).then(() => {
            alert('본문이 복사되었습니다.');
        });
    }
}

loadResult();
</script>
</body>
</html>
