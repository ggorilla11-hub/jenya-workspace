<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>제니야 작업공간 - 오상열 대표</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
}
header {
    background: white;
    border-radius: 20px;
    padding: 30px 40px;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
header h1 {
    color: #667eea;
    font-size: 32px;
    margin-bottom: 10px;
}
header .subtitle {
    color: #666;
    font-size: 16px;
}
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}
.stat-card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    text-align: center;
}
.stat-card .value {
    font-size: 36px;
    font-weight: bold;
    color: #667eea;
    margin-bottom: 5px;
}
.stat-card .label {
    color: #666;
    font-size: 14px;
}
.section {
    background: white;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}
.section h2 {
    color: #333;
    font-size: 22px;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid #f0f0f0;
}
.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}
.result-card {
    background: #f8f9ff;
    padding: 20px;
    border-radius: 12px;
    border-left: 4px solid #667eea;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
}
.result-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
}
.result-card .type {
    display: inline-block;
    background: #667eea;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 10px;
}
.result-card h3 {
    color: #333;
    font-size: 16px;
    margin-bottom: 8px;
}
.result-card .meta {
    color: #888;
    font-size: 13px;
}
.empty {
    text-align: center;
    padding: 40px;
    color: #888;
}
.empty .icon { font-size: 48px; margin-bottom: 15px; }
footer {
    text-align: center;
    color: white;
    padding: 30px;
    opacity: 0.8;
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>🤖 제니야 작업공간</h1>
        <div class="subtitle">오상열 대표 비서실장 - AI 에이전트 결과물 보관소</div>
    </header>

    <div class="stats">
        <div class="stat-card">
            <div class="value" id="totalCount">0</div>
            <div class="label">총 결과물</div>
        </div>
        <div class="stat-card">
            <div class="value" id="todayCount">0</div>
            <div class="label">오늘 생성</div>
        </div>
        <div class="stat-card">
            <div class="value" id="proposalCount">0</div>
            <div class="label">제안서</div>
        </div>
        <div class="stat-card">
            <div class="value" id="reportCount">0</div>
            <div class="label">분석 보고서</div>
        </div>
    </div>

    <div class="section">
        <h2>📋 최근 결과물</h2>
        <div id="resultsContainer">
            <div class="empty">
                <div class="icon">📭</div>
                <p>아직 생성된 결과물이 없습니다.</p>
                <p style="margin-top: 10px; font-size: 14px;">카카오톡에서 제니야에게 명령해 보세요.</p>
                <p style="margin-top: 5px; font-size: 13px; color: #aaa;">예: "제안서 만들어줘", "이 증권 분석해줘"</p>
            </div>
        </div>
    </div>

    <footer>
        <p>제니야 작업공간 v1.0 | Powered by Claude Opus 4.7</p>
    </footer>
</div>

<script>
async function loadResults() {
    try {
        const response = await fetch('https://jenya-cloud.onrender.com/workspace-list');
        const data = await response.json();
        
        if (data.results && data.results.length > 0) {
            displayResults(data.results);
            updateStats(data.results);
        }
    } catch (error) {
        console.log('아직 작업공간 API 미연결');
    }
}

function displayResults(results) {
    const container = document.getElementById('resultsContainer');
    container.innerHTML = '<div class="results-grid"></div>';
    const grid = container.querySelector('.results-grid');
    
    results.forEach(r => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
            <span class="type">${r.type || '일반'}</span>
            <h3>${r.title || '제목 없음'}</h3>
            <div class="meta">${r.createdAt || ''}</div>
        `;
        card.onclick = () => window.open(r.url, '_blank');
        grid.appendChild(card);
    });
}

function updateStats(results) {
    document.getElementById('totalCount').textContent = results.length;
    
    const today = new Date().toDateString();
    const todayCount = results.filter(r => 
        new Date(r.createdAt).toDateString() === today
    ).length;
    document.getElementById('todayCount').textContent = todayCount;
    
    const proposals = results.filter(r => r.type === '제안서').length;
    document.getElementById('proposalCount').textContent = proposals;
    
    const reports = results.filter(r => r.type === '분석보고서').length;
    document.getElementById('reportCount').textContent = reports;
}

loadResults();
setInterval(loadResults, 30000);
</script>
</body>
</html>
